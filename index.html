<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="game-info">
            <h1>TETRIS</h1>
            <div class="score-container">
                <p>Score: <span id="score">0</span></p>
                <p>Lines: <span id="lines">0</span></p>
                <p>Level: <span id="level">1</span></p>
            </div>
            <div class="next-piece-container">
                <h2>Next:</h2>
                <canvas id="next-piece" width="100" height="100"></canvas>
            </div>
            <div class="hold-piece-container">
                <h2>Hold:</h2>
                <canvas id="hold-piece" width="100" height="100"></canvas>
            </div>
            <div class="controls">
                <button id="start-btn">Start Game</button>
                <button id="pause-btn" disabled>Pause</button>
                <div class="sound-controls">
                    <button id="toggle-music">Music: ON</button>
                    <button id="toggle-sound">Sound: ON</button>
                </div>
                <div class="sensitivity-control">
                    <label for="sensitivity-slider">Movement Sensitivity:</label>
                    <input type="range" id="sensitivity-slider" min="50" max="200" value="100" step="10">
                    <span id="sensitivity-value">100%</span>
                </div>
                <div class="keys-info">
                    <h3>Controls:</h3>
                    <p>← → : Move left/right</p>
                    <p>↑ : Rotate</p>
                    <p>↓ : Move down</p>
                    <p>Space : Drop</p>
                    <p>C : Hold piece</p>
                </div>
            </div>
        </div>
        <div class="game-container">
            <canvas id="game-board" width="300" height="600"></canvas>
        </div>
    </div>
    <!-- Audio elements for BGM and sound effects -->
    <audio id="bgm" loop>
        <source src="audio/bgm.mp3" type="audio/mp3">
    </audio>
    <audio id="move-sound" preload="auto">
        <source src="audio/move.mp3" type="audio/mp3">
    </audio>
    <audio id="rotate-sound" preload="auto">
        <source src="audio/rotate.mp3" type="audio/mp3">
    </audio>
    <audio id="drop-sound" preload="auto">
        <source src="audio/drop.mp3" type="audio/mp3">
    </audio>
    <audio id="line-clear-sound" preload="auto">
        <source src="audio/line-clear.mp3" type="audio/mp3">
    </audio>
    <audio id="game-over-sound" preload="auto">
        <source src="audio/game-over.mp3" type="audio/mp3">
    </audio>
    <script src="script.js"></script>
</body>
</html>
